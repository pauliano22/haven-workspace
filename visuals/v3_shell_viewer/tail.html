<script>
(function(){
const stage=document.getElementById("stage");
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,1,500);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.insertBefore(ren.domElement,stage.firstChild);
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,0.85));
const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(30,40,60);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.35);dl2.position.set(-40,-20,-50);scene.add(dl2);
const ctl=new THREE.OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.target.set(0,-1,0);
function b64(s,T){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer);}
function shell(d,color){const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(b64(d.v,Float32Array),3));g.setIndex(new THREE.BufferAttribute(b64(d.f,Uint32Array),1));g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.05,side:THREE.DoubleSide,transparent:true,opacity:1}));}
const tray=shell(MESH.tray,0x5b8fd0),lid=shell(MESH.lid,0xe9a64a);scene.add(tray,lid);
function box(x0,x1,y0,y1,z0,z1,color,metal){const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),new THREE.MeshStandardMaterial({color,roughness:.6,metalness:metal||0}));m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);return m;}
const parts=new THREE.Group();
parts.add(box(-4.8,4.8,-11,11,-.4,.4,0x3f9a6b),box(-4.0,4.0,-13.5,13.5,-.4,.4,0x3f9a6b));
parts.add(box(-3.9,3.9,1.1,13.5,.4,2.25,0x9aa0a6,.5));
parts.add(box(-4.0,4.0,-13.5,6.5,-3.9,-.5,0xc9ccd1,.7));
parts.add(box(-0.15,2.55,-6.47,-4.12,.4,.95,0x2b2e33),box(1.6,4.2,-11.5,-8.9,.4,.9,0x2b2e33),box(-4.5,-0.95,-4.1,.4,.4,1.4,0xb8a36a,.6));
scene.add(parts);
const pins=new THREE.Group();
for(const x of[-1.3,1.3]){const pm=new THREE.MeshStandardMaterial({color:0xd9c25a,metalness:.8,roughness:.3});for(const[r,z0,z1]of[[1.0,-.9,-.4],[.75,-3.4,-.9],[.5,-4.9,-3.4]]){const p=new THREE.Mesh(new THREE.CylinderGeometry(r,r,z1-z0,24),pm);p.rotation.x=Math.PI/2;p.position.set(x,8.65,(z0+z1)/2);pins.add(p);}}
scene.add(pins);
const ex=document.getElementById("explode");
function apply(){const e=ex.value/100;lid.position.z=e*14;tray.position.z=-e*14;
  lid.visible=document.getElementById("c-lid").checked;tray.visible=document.getElementById("c-tray").checked;
  parts.visible=document.getElementById("c-parts").checked;pins.visible=document.getElementById("c-pins").checked;
  const g=document.getElementById("c-glass").checked;for(const m of[lid,tray]){m.material.opacity=g?.28:1;m.material.depthWrite=!g;}}
for(const id of["c-lid","c-tray","c-parts","c-pins","c-glass"])document.getElementById(id).addEventListener("change",apply);
ex.addEventListener("input",apply);
const views={out:[0,-1,80],head:[0,-1,-80],edge:[80,-1,0],iso:[45,-28,58]};
function view(k){const v=views[k];cam.position.set(v[0],v[1],v[2]);cam.up.set(0,1,0);ctl.target.set(0,-1,0);ctl.update();}
document.querySelectorAll("button[data-v]").forEach(b=>b.addEventListener("click",()=>view(b.dataset.v)));
function size(){const w=stage.clientWidth,h=stage.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(size).observe(stage);size();view("iso");apply();
(function loop(){ctl.update();ren.render(scene,cam);requestAnimationFrame(loop);})();
window.__ok=true;
})();
</script>
